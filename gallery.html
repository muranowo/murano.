<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Designs — Nikhil Maharjan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-mark">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <rect x="0" y="0" width="7" height="7" fill="#2b4cff"/>
        <rect x="9" y="0" width="7" height="7" fill="#f2f2ee"/>
        <rect x="0" y="9" width="7" height="7" fill="#f2f2ee"/>
        <rect x="9" y="9" width="7" height="7" fill="#ff5c39"/>
      </svg>
      Nikhil Maharjan
    </a>
    <ul class="nav-links">
      <li><a href="index.html#works">&larr; Back</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <header class="gallery-header">
    <p class="eyebrow">Everything, unsorted</p>
    <h1>All the designs,<br><em>scattered on purpose.</em></h1>
    <p class="gallery-sub">Twelve-ish things I've made. Click a tile to zoom in, use the arrows (or your keyboard) to flip through the rest.</p>
  </header>

  <main class="gallery-grid" id="galleryGrid">
    <!-- cards are generated by gallery.js from the DESIGNS array -->
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-visual" id="modalVisual">
        <span class="modal-visual-mark" id="modalMark"></span>
      </div>
      <div class="modal-info">
        <span class="modal-index" id="modalIndex">01 / 12</span>
        <h2 id="modalTitle">Title</h2>
        <p class="modal-tag" id="modalTag">Tag</p>
        <p class="modal-desc" id="modalDesc">Description.</p>
        <div class="modal-nav">
          <button class="modal-btn" id="modalPrev">&larr; Prev</button>
          <button class="modal-btn" id="modalNext">Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span>© 2026 Nikhil Maharjan</span>
    <span>Kathmandu, NP</span>
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
